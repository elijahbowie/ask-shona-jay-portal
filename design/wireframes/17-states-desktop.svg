<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img">
<rect width="1280" height="420" fill="#f4f6f9"/>
<rect x="0" y="0" width="1280" height="420" rx="0" ry="0" fill="#f4f6f9" stroke="none" stroke-width="1"/><rect x="24" y="24" width="394.6666666666667" height="372" rx="16" ry="16" fill="#ffffff" stroke="#d4dae3" stroke-width="1"/><text x="48" y="56" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="1.5">EMPTY</text><rect x="48" y="90" width="346.6666666666667" height="220" rx="12" ry="12" fill="#eef1f6" stroke="#d4dae3" stroke-width="1" stroke-dasharray="5 5"/><text x="68" y="150" font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="700" fill="#001532" text-anchor="start" letter-spacing="0">No history yet</text><text x="68" y="176" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#8590a8" text-anchor="start" letter-spacing="0">Ask a question and it shows here.</text><rect x="68" y="200" width="160" height="40" rx="20" ry="20" fill="#15679f" stroke="none" stroke-width="1"/><text x="148" y="224" font-family="DM Sans, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" letter-spacing="0">Ask a question</text><rect x="48" y="324" width="346.6666666666667" height="50" rx="8" ry="8" fill="#eef6fc" stroke="#d7ecfa" stroke-width="1"/><rect x="48" y="324" width="3" height="50" rx="0" ry="0" fill="#15679f" stroke="none" stroke-width="1"/><text x="58" y="345" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="0">Modeling: empty states show the first action + a stub</text><text x="58" y="360" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#15679f" text-anchor="start" letter-spacing="0">of what will appear, not a dead end.</text><rect x="442.6666666666667" y="24" width="394.6666666666667" height="372" rx="16" ry="16" fill="#ffffff" stroke="#d4dae3" stroke-width="1"/><text x="466.6666666666667" y="56" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="1.5">LOADING</text><rect x="466.6666666666667" y="100" width="346.6666666666667" height="12" rx="6" ry="6" fill="#dfe5ee" stroke="none" stroke-width="1"/><rect x="466.6666666666667" y="128" width="346.6666666666667" height="12" rx="6" ry="6" fill="#eef1f6" stroke="none" stroke-width="1"/><rect x="466.6666666666667" y="156" width="346.6666666666667" height="12" rx="6" ry="6" fill="#dfe5ee" stroke="none" stroke-width="1"/><rect x="466.6666666666667" y="184" width="173.33333333333334" height="12" rx="6" ry="6" fill="#eef1f6" stroke="none" stroke-width="1"/><rect x="466.6666666666667" y="324" width="346.6666666666667" height="50" rx="8" ry="8" fill="#eef6fc" stroke="#d7ecfa" stroke-width="1"/><rect x="466.6666666666667" y="324" width="3" height="50" rx="0" ry="0" fill="#15679f" stroke="none" stroke-width="1"/><text x="476.6666666666667" y="345" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="0">Shimmer skeletons mirror the real layout so the eye</text><text x="476.6666666666667" y="360" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#15679f" text-anchor="start" letter-spacing="0">lands in the right place on arrival.</text><rect x="861.3333333333334" y="24" width="394.6666666666667" height="372" rx="16" ry="16" fill="#ffffff" stroke="#d4dae3" stroke-width="1"/><text x="885.3333333333334" y="56" font-family="DM Sans, Arial, sans-serif" font-size="10" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="1.5">ERROR</text><rect x="885.3333333333334" y="100" width="346.6666666666667" height="60" rx="10" ry="10" fill="#fce5e9" stroke="rgba(199,52,74,0.3)" stroke-width="1"/><text x="901.3333333333334" y="136" font-family="DM Sans, Arial, sans-serif" font-size="12" font-weight="500" fill="#a32a3c" text-anchor="start" letter-spacing="0">Unable to answer right now.</text><rect x="885.3333333333334" y="180" width="90" height="26" rx="13" ry="13" fill="#ffffff" stroke="#e7ebf1" stroke-width="1"/><text x="930.3333333333334" y="197" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#3c4a63" text-anchor="middle" letter-spacing="0">Try again</text><rect x="885.3333333333334" y="324" width="346.6666666666667" height="50" rx="8" ry="8" fill="#eef6fc" stroke="#d7ecfa" stroke-width="1"/><rect x="885.3333333333334" y="324" width="3" height="50" rx="0" ry="0" fill="#15679f" stroke="none" stroke-width="1"/><text x="895.3333333333334" y="345" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="700" fill="#15679f" text-anchor="start" letter-spacing="0">Errors stay calm and recoverable: plain cause + one</text><text x="895.3333333333334" y="360" font-family="DM Sans, Arial, sans-serif" font-size="11" font-weight="400" fill="#15679f" text-anchor="start" letter-spacing="0">retry, never a stack trace or dead screen.</text>
</svg>